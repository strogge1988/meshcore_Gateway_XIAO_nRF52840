; XIAO nRF52840 / Wio-SX1262 repeater with 3.3 V UART bridge
; GPIO D6=UART TX, D7=UART RX, GND common.
[env:Xiao_nrf52_repeater_rs232]
extends = env:Xiao_nrf52_repeater
build_flags =
    ${env:Xiao_nrf52_repeater.build_flags}
    -D WITH_RS232_BRIDGE=Serial1
    -D WITH_RS232_BRIDGE_RX=D7
    -D WITH_RS232_BRIDGE_TX=D6
build_src_filter =
    ${env:Xiao_nrf52_repeater.build_src_filter}
    +<helpers/bridges/RS232Bridge.cpp>
